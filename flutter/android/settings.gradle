pluginManagement {
    // 安卓不编 fvp（pubspec 仍留给桌面/iOS）。须在本块内、且在 plugin-loader 之前改 deps。
    def kotvFlutterPluginsDeps = file("../.flutter-plugins-dependencies")
    if (kotvFlutterPluginsDeps.exists()) {
        def slurper = new groovy.json.JsonSlurper()
        def data = slurper.parse(kotvFlutterPluginsDeps)
        def androidPlugins = data?.plugins?.android
        if (androidPlugins instanceof List) {
            def filtered = androidPlugins.findAll { it?.name != "fvp" }
            if (filtered.size() != androidPlugins.size()) {
                data.plugins.android = filtered
                kotvFlutterPluginsDeps.write(groovy.json.JsonOutput.toJson(data), "UTF-8")
                println "[android] settings: removed fvp from .flutter-plugins-dependencies"
            }
        }
    }

    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://chaquo.com/maven" }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 9.2.1 能编译 platforms;android-37.0。Chaquopy 17 只支持到 AGP 9.2，不再往上。
    // Flutter 3.47.6 的 Gradle 插件仍引用旧 variant API，所以保留 android.newDsl=false。
    id "com.android.application" version "9.2.1" apply false
    id "com.android.library" version "9.2.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
    // 17+ 才能识别 settings.gradle plugins 声明的 AGP（见 chaquopy#1289）
    id "com.chaquo.python" version "17.0.0" apply false
}

include ":app"
include ":kotv-bridge"
